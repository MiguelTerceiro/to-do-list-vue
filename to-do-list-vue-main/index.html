<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-i18n@9/dist/vue-i18n.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">

        <div class="lang-switcher">
            <button :class="{ active: $i18n.locale === 'pt' }" @click="setLocale('pt')">PT</button>
            <button :class="{ active: $i18n.locale === 'en' }" @click="setLocale('en')">EN</button>
        </div>

        <div v-if="!currentUser" class="auth-box">
            <p class="header-label">autenticação</p>
            <h1>Bem-vindo<br><span>de volta.</span></h1>

            <div class="tabs">
                <button :class="{ active: authMode === 'login' }" @click="authMode = 'login'">Login</button>
                <button :class="{ active: authMode === 'register' }" @click="authMode = 'register'">Registo</button>
            </div>

            <div v-if="authMode === 'login'" class="add-form auth-form">
                <input v-model="loginForm.email" type="email" placeholder="Email" @keyup.enter="login" />
                <input v-model="loginForm.password" type="password" placeholder="Password" @keyup.enter="login" />
                <button @click="login">→</button>
            </div>

            <div v-else class="add-form auth-form">
                <input v-model="registerForm.username" type="text" placeholder="Username" @keyup.enter="register" />
                <input v-model="registerForm.email" type="email" placeholder="Email" @keyup.enter="register" />
                <input v-model="registerForm.password" type="password" placeholder="Password" @keyup.enter="register" />
                <button @click="register">+</button>
            </div>
        </div>

        <template v-else>
            <div class="user-bar">
                <span>Olá, {{ currentUser.username }}</span>
                <button class="clear-btn" @click="logout">Logout</button>
            </div>

            <p class="header-label">{{ $t('header.label') }}</p>
            <h1>{{ $t('header.title') }}<br><span>{{ $t('header.subtitle') }}</span></h1>

            <div class="stats">
                <div class="stat">
                    <span class="stat-num pending">{{ pendingCount }}</span>
                    <span class="stat-label">{{ $t('stats.pending') }}</span>
                </div>
                <div class="stat">
                    <span class="stat-num done">{{ doneCount }}</span>
                    <span class="stat-label">{{ $t('stats.done') }}</span>
                </div>
                <div class="stat">
                    <span class="stat-num total">{{ tasks.length }}</span>
                    <span class="stat-label">{{ $t('stats.total') }}</span>
                </div>
            </div>

            <div class="progress-wrap" v-if="tasks.length > 0">
                <div class="progress-bar" :style="{ width: progressPct + '%' }"></div>
            </div>

            <div class="add-form">
                <input
                    v-model="newTaskText"
                    :placeholder="$t('form.placeholder')"
                    @keyup.enter="addTask"
                />
                <button @click="addTask">+</button>
            </div>

            <div class="tabs">
                <button :class="{ active: filter === 'all' }" @click="filter = 'all'">
                    <span class="tab-dot all"></span> {{ $t('tabs.all') }}
                </button>
                <button :class="{ active: filter === 'pending' }" @click="filter = 'pending'">
                    <span class="tab-dot pending"></span> {{ $t('tabs.pending') }}
                </button>
                <button :class="{ active: filter === 'done' }" @click="filter = 'done'">
                    <span class="tab-dot done"></span> {{ $t('tabs.done') }}
                </button>
            </div>

            <ul>
                <div v-if="filteredTasks.length === 0" class="empty">
                    <span v-if="filter === 'done'">{{ $t('empty.done') }}</span>
                    <span v-else-if="filter === 'pending'">{{ $t('empty.pending') }}</span>
                    <span v-else>{{ $t('empty.all') }}</span>
                </div>

                <li
                    v-for="task in filteredTasks"
                    :key="task.id"
                    :class="{ done: task.isDone }"
                >
                    <div class="checkbox" @click="toggleDone(task)">
                        <span v-if="task.isDone">✓</span>
                    </div>

                    <div class="task-body">
                        <input
                            v-if="editingId === task.id"
                            :id="'edit-' + task.id"
                            v-model="editText"
                            class="edit-input"
                            @keyup.enter="saveEdit(task)"
                            @keyup.escape="cancelEdit"
                        />
                        <div v-else class="task-text">{{ task.text }}</div>
                        <div class="task-date">{{ task.date }}</div>
                    </div>

                    <div class="task-actions">
                        <template v-if="editingId === task.id">
                            <button class="icon-btn confirm" @click="saveEdit(task)" :title="$t('actions.save')">✓</button>
                            <button class="icon-btn danger" @click="cancelEdit" :title="$t('actions.cancel')">✕</button>
                        </template>
                        <template v-else>
                            <button class="icon-btn" @click="startEdit(task)" :title="$t('actions.edit')">✎</button>
                            <button class="icon-btn danger" @click="removeTask(task.id)" :title="$t('actions.delete')">X</button>
                        </template>
                    </div>
                </li>
            </ul>

            <button class="clear-btn" v-if="doneCount > 0" @click="clearDone">
                {{ $t('actions.clearDone') }} ({{ doneCount }})
            </button>
        </template>

    </div>

    <script src="app.js"></script>
</body>
</html>
