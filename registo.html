<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
 <div id="app">
<div class="auth-page-wrap">
    <div class="auth-card">

        <a href="index.html" class="back-btn">{{ $t('back') }}</a>

        <div class="auth-eyebrow">{{ $t('createAccount') }}</div>
        <h1 class="auth-title">{{ $t('new') }}<br><span>{{ $t('register') }}</span></h1>

        <form action="/register" method="POST">
            <div class="field">
                <label for="username">{{ $t('username') }}</label>
                <input type="text" id="username" name="username" placeholder="escolhe um utilizador" required>
            </div>
            <div class="field">
                <label for="email">{{ $t('email') }}</label>
                <input type="email" id="email" name="email" placeholder="teu@email.com" required>
            </div>
            <div class="field">
                <label for="password">{{ $t('password') }}</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="auth-btn"> {{ $t('createAccount') }} </button>
        </form>

        <div class="auth-footer">
            {{ $t('ahaaccount') }} <a href="login.html">{{ $t('login') }}</a>
        </div>

        <div class="card-dots">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
    </div>
</div>
</div>

<script type="module" src="/src/app.js"></script>

</body>
</html>
